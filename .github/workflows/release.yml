name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version without the v prefix, either X.Y.Z or a pre-release such as
          0.1.34rc1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_commit: ${{ steps.provenance.outputs.release_commit }}
      source_date_epoch: ${{ steps.provenance.outputs.source_date_epoch }}
      tag: ${{ steps.release.outputs.tag }}
      tag_object: ${{ steps.provenance.outputs.tag_object }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate workflow ref
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release must run from main" >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.14

      - name: Validate release state
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$RELEASE_VERSION"
          release_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?$'
          if [[ ! "$version" =~ $release_version ]]; then
            echo "version must match X.Y.Z or a pre-release such as 0.1.34rc1, without a v prefix" >&2
            exit 1
          fi

          current_version="$(uv version --short)"
          if [[ ! "$current_version" =~ $release_version ]]; then
            echo "current project version is neither X.Y.Z nor a pre-release" >&2
            exit 1
          fi

          # a pre-release sorts before the release it leads to, which comparing
          # the three numbers cannot express, so the order comes from PEP 440
          compare='import sys; from packaging.version import Version; sys.exit(0 if Version(sys.argv[2]) >= Version(sys.argv[1]) else 1)'
          if ! uv run --no-project --with packaging python -c "$compare" \
            "$current_version" "$version"; then
            echo "version $version is older than current version $current_version" >&2
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "checkout is not the latest origin/main" >&2
            exit 1
          fi

          tag="v$version"
          if [[ "$version" == "$current_version" ]]; then
            if [[ "$(git log -1 --format=%s)" != "Release $tag" ]]; then
              echo "current version already matches, but HEAD is not its release commit" >&2
              exit 1
            fi
            changed_paths="$(git diff-tree --no-commit-id --name-only -r HEAD | sort)"
            if [[ "$changed_paths" != $'CHANGELOG.md\npyproject.toml\nuv.lock' ]]; then
              echo "release commit changed unexpected paths" >&2
              exit 1
            fi
            heading_pattern="^## ${version//./\\.} - [0-9]{4}-[0-9]{2}-[0-9]{2}$"
            if [[ "$(grep -Ec "$heading_pattern" CHANGELOG.md)" != "1" ]]; then
              echo "release changelog heading must appear exactly once" >&2
              exit 1
            fi
            mode="retry"
          else
            previous_tag="$(git describe --tags --abbrev=0 HEAD)"
            if [[ "$(git cat-file -t "refs/tags/$previous_tag")" != "tag" ]]; then
              echo "previous release tag $previous_tag is not annotated" >&2
              exit 1
            fi
            mode="new"
          fi

          if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
            tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
            if [[ "$mode" != "retry" || "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
              echo "tag $tag already points to a different release state" >&2
              exit 1
            fi
          fi

          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag:-}" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Run checks
        uses: ./.github/actions/checks

      - name: Set release version
        if: steps.release.outputs.mode == 'new'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv version "$RELEASE_VERSION" --no-sync
          uv lock --check
          changed_paths="$(git diff --name-only | sort)"
          if [[ "$changed_paths" != $'pyproject.toml\nuv.lock' ]]; then
            echo "version update changed unexpected paths" >&2
            exit 1
          fi

      - name: Create verified release commit
        if: steps.release.outputs.mode == 'new'
        id: version_commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const fs = require("fs");
            const expectedHeadOid = (await exec.getExecOutput(
              "git",
              ["rev-parse", "HEAD"],
              {silent: true},
            )).stdout.trim();
            const version = "${{ steps.release.outputs.version }}";
            const generated = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "${{ steps.release.outputs.tag }}",
              target_commitish: expectedHeadOid,
              previous_tag_name: "${{ steps.release.outputs.previous_tag }}",
            });
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const headingPattern = new RegExp(
              `^## ${version.replaceAll(".", "\\.")} - \\d{4}-\\d{2}-\\d{2}$`,
              "gm",
            );
            if (changelog.match(headingPattern)?.length) {
              throw new Error(`CHANGELOG.md already contains version ${version}`);
            }
            const insertionPoint = changelog.indexOf("\n## ");
            if (insertionPoint === -1) {
              throw new Error("CHANGELOG.md does not contain a release section");
            }
            const releaseDate = new Date().toISOString().slice(0, 10);
            const releaseSection = [
              `## ${version} - ${releaseDate}`,
              generated.data.body.trim(),
            ].join("\n\n");
            fs.writeFileSync(
              "CHANGELOG.md",
              `${changelog.slice(0, insertionPoint + 1)}${releaseSection}\n\n${changelog.slice(insertionPoint + 1)}`,
            );
            const changedPaths = (await exec.getExecOutput(
              "git",
              ["diff", "--name-only"],
              {silent: true},
            )).stdout.trim().split("\n").sort();
            const expectedPaths = ["CHANGELOG.md", "pyproject.toml", "uv.lock"];
            if (JSON.stringify(changedPaths) !== JSON.stringify(expectedPaths)) {
              throw new Error(`Release update changed unexpected paths: ${changedPaths.join(", ")}`);
            }
            const encode = (path) => fs.readFileSync(path).toString("base64");
            const input = {
              branch: {
                repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                branchName: "main",
              },
              expectedHeadOid,
              message: {headline: `Release ${{ steps.release.outputs.tag }}`},
              fileChanges: {
                additions: [
                  {path: "CHANGELOG.md", contents: encode("CHANGELOG.md")},
                  {path: "pyproject.toml", contents: encode("pyproject.toml")},
                  {path: "uv.lock", contents: encode("uv.lock")},
                ],
              },
            };
            const mutation = `
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit {
                    oid
                    signature {
                      isValid
                      wasSignedByGitHub
                    }
                  }
                }
              }
            `;
            const result = await github.graphql(mutation, {input});
            const {oid, signature} = result.createCommitOnBranch.commit;
            if (!signature?.isValid || !signature.wasSignedByGitHub) {
              throw new Error("Release commit was not signed and verified by GitHub");
            }
            return oid;

      - name: Checkout release commit
        if: steps.release.outputs.mode == 'new'
        env:
          RELEASE_COMMIT: ${{ steps.version_commit.outputs.result }}
        run: |
          git restore CHANGELOG.md pyproject.toml uv.lock
          git fetch origin main
          git checkout --detach "$RELEASE_COMMIT"
          if [[ "$(git rev-parse origin/main)" != "$RELEASE_COMMIT" ]]; then
            echo "origin/main does not point to the release commit" >&2
            exit 1
          fi

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >>"$GITHUB_ENV"

      - name: Create local release tag
        id: provenance
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
              echo "tag $RELEASE_TAG is not annotated" >&2
              exit 1
            fi
            if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "tag $RELEASE_TAG does not point to the release commit" >&2
              exit 1
            fi
          else
            GIT_COMMITTER_DATE="@$SOURCE_DATE_EPOCH +0000" \
              git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          fi

          echo "release_commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "source_date_epoch=$SOURCE_DATE_EPOCH" >>"$GITHUB_OUTPUT"
          echo "tag_object=$(git rev-parse "refs/tags/$RELEASE_TAG")" >>"$GITHUB_OUTPUT"

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: uv run --isolated --no-project --with dist/*.whl tests/package_smoke.py "$RELEASE_VERSION"

      - name: Smoke test source distribution
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/package_smoke.py "$RELEASE_VERSION"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bazaar-compute-node/${{ needs.prepare.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-${{ needs.prepare.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  finalize:
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_commit }}

      - name: Push release tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
              echo "tag $RELEASE_TAG is not annotated" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            GIT_COMMITTER_DATE="@$SOURCE_DATE_EPOCH +0000" \
              git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          fi

          if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG")" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "tag $RELEASE_TAG does not match the locally validated tag object" >&2
            exit 1
          fi

          if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "tag $RELEASE_TAG does not point to the release commit" >&2
            exit 1
          fi

          git push origin "refs/tags/$RELEASE_TAG"
