name: Pull Request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.14

      - name: Run checks
        uses: ./.github/actions/checks

      - name: Read the project version
        id: version
        run: echo "version=$(uv version --short)" >>"$GITHUB_OUTPUT"

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: uv run --isolated --no-project --with dist/*.whl tests/package_smoke.py "$PACKAGE_VERSION"

      - name: Smoke test source distribution
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/package_smoke.py "$PACKAGE_VERSION"
