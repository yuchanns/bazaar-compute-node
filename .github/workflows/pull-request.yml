name: Pull Request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan affected packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.0"

      - name: Install Python
        run: uv python install 3.15

      - name: Install locked dependencies
        run: uv sync --locked --all-packages

      - name: Generate package matrix
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-sync scripts/ci.py plan --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"

  checks:
    name: Static checks (${{ matrix.package }})
    needs: plan
    if: needs.plan.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.matrix).package }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.0"

      - name: Install Python
        run: uv python install 3.15

      - name: Install locked dependencies
        run: uv sync --locked --all-packages

      - name: Run static checks
        run: uv run --no-sync scripts/ci.py check --package "$PACKAGE"

  tests:
    name: Tests (${{ matrix.package }}, ${{ matrix.os }})
    needs: [plan, checks]
    if: needs.plan.outputs.has_packages == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: ${{ fromJson(needs.plan.outputs.matrix).package }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Enable Git symbolic links on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.0"

      - name: Install Python
        run: uv python install 3.15

      - name: Install locked dependencies
        run: uv sync --locked --all-packages

      - name: Run tests
        env:
          TMPDIR: ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}
        run: uv run --no-sync scripts/ci.py test --package "$PACKAGE"

      - name: Prepare the Linux user service manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >>"$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >>"$GITHUB_ENV"

      - name: Run system service tests
        env:
          TMPDIR: ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}
        run: uv run --no-sync scripts/ci.py test --package "$PACKAGE" --system

      - name: Build and verify distributions
        run: uv run --no-sync scripts/ci.py package --package "$PACKAGE"
