name: Checks
description: Run static checks for the selected workspace packages

inputs:
  packages:
    description: Space-separated workspace package names
    required: true

runs:
  using: composite
  steps:
    - name: Run static checks
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        read -r -a packages <<<"$PACKAGES"
        for package in "${packages[@]}"; do
          echo "::group::$package"
          uv run --no-sync scripts/ci.py check --package "$package"
          echo "::endgroup::"
        done
