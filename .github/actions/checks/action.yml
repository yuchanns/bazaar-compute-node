name: Checks
description: Run the required project checks

runs:
  using: composite
  steps:
    - name: Install locked dependencies
      shell: bash
      run: uv sync --locked --all-packages

    - name: Run tests
      shell: bash
      run: uv run --no-sync scripts/ci.py test --all-packages

    - name: Run static checks
      shell: bash
      run: uv run --no-sync scripts/ci.py check --all-packages
