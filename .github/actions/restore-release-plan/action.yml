name: Restore release plan
description: Recover a release plan from its Actions artifacts
inputs:
  version:
    description: Release version
    required: true
  branch:
    description: Release branch
    required: true
runs:
  using: composite
  steps:
    - name: Find saved release state
      id: artifact
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_BRANCH: ${{ inputs.branch }}
      with:
        script: |
          for (const prefix of ['release-plan-', 'python-dist-']) {
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name: prefix + process.env.RELEASE_VERSION, per_page: 100,
            });
            for (const artifact of artifacts.sort((a, b) => b.id - a.id)) {
              if (artifact.expired || artifact.workflow_run?.head_branch !== process.env.RELEASE_BRANCH) continue;
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: artifact.workflow_run.id});
              if (run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/release.yml') continue;
              core.setOutput('id', artifact.id);
              core.setOutput('run', run.id);
              return;
            }
          }

    - name: Download saved release state
      if: steps.artifact.outputs.id != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.artifact.outputs.id }}
        run-id: ${{ steps.artifact.outputs.run }}
        github-token: ${{ github.token }}
        path: build/release/cache/

    - name: Restore release plan
      if: steps.artifact.outputs.id != ''
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_BRANCH: ${{ inputs.branch }}
      run: |
        uv run --no-sync scripts/release.py restore "$RELEASE_VERSION" \
          --branch "$RELEASE_BRANCH" --directory build/release/cache
