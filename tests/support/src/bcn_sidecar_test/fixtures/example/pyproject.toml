[project]
name = "bazaar-sidecar-example"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "bazaar-core~=0.3.0rc1",
    "bazaar-contrib-sidecar~=0.3.0rc8",
    "bazaar-contrib-timer~=0.3.0rc7",
    "bazaar-contrib-invoke~=0.3.0rc1",
    "aiofiles>=25.1.0",
]

[project.entry-points."bazaar_compute_node.contribs"]
sidecar-journal = "bazaar_sidecar_example:journal"
sidecar-controls = "bazaar_sidecar_example:controls"
sidecar-tcp = "bazaar_sidecar_example.tcp:transport"

[project.entry-points."bazaar_compute_node.remotes"]
journal = "bazaar_sidecar_example:remote"

[project.entry-points."bazaar_compute_node.commands"]
remote = "bazaar_sidecar_example:command_entry"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
