[project]
name = "bazaar-contrib-node-management"
version = "0.3.0"
description = "The Bazaar Compute Node Management Contrib"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-core==0.3.0",
    "bazaar-contrib-config==0.3.0",
    "bazaar-contrib-invoke==0.3.0",
    "click>=8.1.0",
]

[project.entry-points."bazaar_compute_node.contribs"]
node-management = "bazaar_contrib_node_management:management"

[project.entry-points."bazaar_compute_node.commands"]
run = "bazaar_contrib_node_management:command_entry"

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extends = "../../pyrightconfig.json"
include = ["src", "tests"]

[tool.ruff]
extend = "../../pyproject.toml"
