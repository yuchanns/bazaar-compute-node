[project]
name = "bazaar-contrib-sidecar"
version = "0.3.0"
description = "Transport-independent sidecar contracts and Context handlers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-core~=0.3.0"]

[project.entry-points."bazaar_compute_node.contribs"]
sidecar = "bazaar_contrib_sidecar:sidecar"

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extends = "../../pyrightconfig.json"
include = ["src", "tests"]

[tool.ruff]
extend = "../../pyproject.toml"
