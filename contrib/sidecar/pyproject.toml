[project]
name = "bazaar-contrib-sidecar"
version = "0.3.0rc11"
description = "Transport-independent sidecar contracts and exposed service calls"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-contrib-timer~=0.3.0rc7", "bazaar-core~=0.3.0rc1"]

[project.entry-points."bazaar_compute_node.contribs"]
sidecar = "bazaar_contrib_sidecar:sidecar"

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.bcn.ci]
skip = true

[tool.pyright]
extends = "../../pyrightconfig.json"
include = ["src"]

[tool.ruff]
extend = "../../pyproject.toml"
