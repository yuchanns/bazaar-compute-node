[project]
name = "bazaar-contrib-storage"
version = "0.3.0rc1"
description = "Shared explicit storage contracts and backend selection"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-core~=0.3.0rc1", "pydantic>=2.12.0"]

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[project.entry-points."bazaar_compute_node.contribs"]
storage = "bazaar_contrib_storage:storage"
database = "bazaar_contrib_storage:database"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.bcn.ci]
skip = true

[tool.pyright]
extends = "../../pyrightconfig.json"
include = ["src"]

[tool.ruff]
extend = "../../pyproject.toml"
