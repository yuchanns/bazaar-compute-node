[project]
name = "bazaar-contrib-config"
version = "0.3.0rc8"
description = "The Bazaar Compute Node Config Contrib"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-core~=0.3.0rc1", "bazaar-contrib-sidecar~=0.3.0rc8", "packaging>=26.0"]

[project.entry-points."bazaar_compute_node.remotes"]
configuration = "bazaar_contrib_config:remote"

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.bcn.ci]
skip = true

[tool.pyright]
extends = "../../pyrightconfig.json"
include = ["src"]

[tool.ruff]
extend = "../../pyproject.toml"
