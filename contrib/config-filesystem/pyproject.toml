[project]
name = "bazaar-contrib-config-filesystem"
version = "0.3.0rc8"
description = "The Bazaar Compute Node Config Filesystem Contrib"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-contrib-config~=0.3.0rc1", "filelock>=3.20.0", "tomli-w>=1.2.0"]

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[project.entry-points."bazaar_compute_node.contribs"]
config-filesystem = "bazaar_contrib_config_filesystem:filesystem"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.bcn.ci]
platforms = ["linux", "windows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extends = "../../pyrightconfig.json"
include = ["src", "tests"]

[tool.ruff]
extend = "../../pyproject.toml"
