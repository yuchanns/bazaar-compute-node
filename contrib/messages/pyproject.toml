[project]
name = "bazaar-contrib-messages"
version = "0.3.0"
description = "Public message, conversation and service contracts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-core~=0.3.0", "bazaar-contrib-channel~=0.3.0"]

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
extends = "../../pyrightconfig.json"
include = ["src"]

[tool.ruff]
extend = "../../pyproject.toml"
