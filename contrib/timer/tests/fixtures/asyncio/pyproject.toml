[project]
name = "bcn-asyncio-timer"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["bazaar-core~=0.3.0", "bazaar-contrib-timer~=0.3.0", "pydantic>=2.12.0"]

[project.entry-points."bazaar_compute_node.contribs"]
asyncio-timer = "bcn_asyncio_timer:timer"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
