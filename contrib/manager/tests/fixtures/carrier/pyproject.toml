[project]
name = "bazaar-contrib-example-carrier"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["bazaar-contrib-config-filesystem~=0.3.0rc1"]

[project.entry-points."bazaar_compute_node.contribs"]
example-config = "bazaar_contrib_config_filesystem:filesystem"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
