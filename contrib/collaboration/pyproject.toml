[project]
name = "bazaar-contrib-collaboration"
version = "0.3.0rc4"
description = "Conversation admission, review and identity association services"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-contrib-legacy-node-migrations~=0.3.0rc1", "bazaar-core~=0.3.0rc1", "bazaar-contrib-schema~=0.3.0rc1", "bazaar-contrib-audit~=0.3.0rc1", "bazaar-contrib-channel~=0.3.0rc1", "bazaar-contrib-messages~=0.3.0rc1", "bazaar-contrib-storage~=0.3.0rc1", "bazaar-contrib-timer~=0.3.0rc1", "pydantic>=2.12.0"]

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[project.entry-points."bazaar_compute_node.contribs"]
collaboration = "bazaar_contrib_collaboration:collaboration"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extends = "../../pyrightconfig.json"
include = ["src", "tests"]
extraPaths = ["../agent/tests/fixtures/workbench/src", "tests/fixtures/gateway/src"]

[tool.ruff]
extend = "../../pyproject.toml"
