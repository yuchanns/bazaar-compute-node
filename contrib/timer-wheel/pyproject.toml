[project]
name = "bazaar-contrib-timer-wheel"
version = "0.3.0rc8"
description = "Shared hierarchical timing wheel"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-core~=0.3.0rc1", "bazaar-contrib-timer~=0.3.0rc1", "pydantic>=2.12.0"]

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[project.entry-points."bazaar_compute_node.contribs"]
timer-wheel = "bazaar_contrib_timer_wheel:timer_wheel"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extends = "../../pyrightconfig.json"
include = ["src", "tests"]

[tool.ruff]
extend = "../../pyproject.toml"
