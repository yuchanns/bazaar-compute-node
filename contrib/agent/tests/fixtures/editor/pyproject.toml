[project]
name = "bcn-editor-agent"
version = "0.1.0"
description = "An independent editorial agent using public services and providers"
requires-python = ">=3.15"
dependencies = ["bazaar-contrib-agent~=0.3.0rc1", "bazaar-contrib-messages~=0.3.0rc1", "bazaar-core~=0.3.0rc1", "bazaar-contrib-channel~=0.3.0rc1", "bazaar-contrib-harness~=0.3.0rc1", "bazaar-contrib-config~=0.3.0rc1", "bcn-agent-workbench==0.1.0", "pydantic>=2.12.0"]

[project.entry-points."bazaar_compute_node.contribs"]
editor-agent = "bcn_editor_agent:editor"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
