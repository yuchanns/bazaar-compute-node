[project]
name = "bcn-agent-workbench"
version = "0.1.0"
description = "A TCP control channel and a subprocess document-report harness"
requires-python = ">=3.15"
dependencies = ["bazaar-core~=0.3.0rc1", "bazaar-contrib-channel~=0.3.0rc1", "bazaar-contrib-harness~=0.3.0rc1", "bazaar-contrib-config~=0.3.0rc1", "tomli-w>=1.2.0", "pydantic>=2.12.0"]

[project.entry-points."bazaar_compute_node.contribs"]
test-channel-builder = "bcn_agent_workbench:channel_builder"
secondary-channel-builder = "bcn_agent_workbench:secondary_channel_builder"
test-channel = "bcn_agent_workbench:channel"
document-builder = "bcn_agent_workbench:harness_builder"
document = "bcn_agent_workbench:harness"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
