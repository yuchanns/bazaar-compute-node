[project]
name = "bazaar-contrib-agent"
version = "0.3.0rc2"
description = "Agent configuration, instances and local composition"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-contrib-config~=0.3.0rc1",
    "bazaar-contrib-messages~=0.3.0rc1",
    "bazaar-contrib-collaboration~=0.3.0rc1",
    "bazaar-contrib-reminder~=0.3.0rc1",
    "bazaar-contrib-timer~=0.3.0rc1",
    "bazaar-contrib-legacy-node-migrations~=0.3.0rc1",
    "bazaar-core~=0.3.0rc1",
    "bazaar-contrib-storage~=0.3.0rc1",
    "bazaar-contrib-schema~=0.3.0rc1",
    "bazaar-contrib-audit~=0.3.0rc1",
    "bazaar-contrib-channel~=0.3.0rc1",
    "bazaar-contrib-harness~=0.3.0rc1",
    "bazaar-contrib-sidecar~=0.3.0rc1",
    "bazaar-contrib-invoke~=0.3.0rc1",
    "click>=8.1.0",
    "jinja2>=3.1.6",
    "pydantic>=2.12.0",
]

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[project.entry-points."bazaar_compute_node.contribs"]
agent = "bazaar_contrib_agent:agent"
agent-execution = "bazaar_contrib_agent:execution"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.bcn.ci]
platforms = ["linux", "windows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extends = "../../pyrightconfig.json"
include = ["src", "tests"]
extraPaths = ["tests/fixtures/journal/src", "tests/fixtures/workbench/src", "tests/fixtures/editor/src"]

[tool.ruff]
extend = "../../pyproject.toml"
