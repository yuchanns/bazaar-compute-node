{% import "components.html" as c with context %}
{# who the page is about; after a rename it comes again out of band, under
   the name just saved, before the computer's next beat says it #}
<div class="hd" id="profile-head"{% if oob is defined and oob %} hx-swap-oob="outerHTML"{% endif %}>

  {{ name }}
  <span class="icons">{{ c.agent_icons(selected) }}</span>
</div>
