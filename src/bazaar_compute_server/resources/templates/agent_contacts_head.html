{% import "components.html" as c with context %}
<div id="agent-contacts-head" x-poll data-poll='{{ poll("agent-info", selected)|tojson }}' data-poll-url="/agents/{{ ref(selected.computer_id) }}/{{ ref(selected.id) }}/head">
  {% call c.column_header(selected.name, back="/agents") %}
    <span class="sub">{{ c.system(selected) }}{{ c.channels(selected.channels) }}</span>
  {% endcall %}
</div>
