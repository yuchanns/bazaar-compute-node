<form class="dialog" id="password" hx-post="/settings/password" hx-target="this" hx-swap="outerMorph">
  <div class="field"><label for="current">{{ t.text("settings.current") }}</label><input id="current" name="current" type="password" required autocomplete="current-password"></div>
  <div class="field"><label for="new">{{ t.text("settings.new") }}</label><input id="new" name="new" type="password" required autocomplete="new-password"></div>
  {% if outcome == "wrong" %}<p class="err">{{ t.text("settings.wrong_current") }}</p>{% endif %}
  {% if outcome == "short" %}<p class="err">{{ t.text("settings.short") }}</p>{% endif %}
  {% if outcome == "changed" %}<p class="ok">{{ t.text("settings.changed") }}</p>{% endif %}
  <button class="btn p" type="submit">{{ t.text("settings.change") }}</button>
</form>
