[project]
name = "bazaar-compute-node"
version = "0.1.0"
description = "Runtime-agnostic computer node daemon for agents and channels."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bcn = "bazaar_compute_node.cli:main"

[project.entry-points."bazaar_compute_node.channels"]
dummy = "bazaar_compute_node.contrib.dummy.plugin:create_channel"

[project.entry-points."bazaar_compute_node.runtimes"]
dummy = "bazaar_compute_node.contrib.dummy.plugin:create_runtime"

[project.entry-points."bazaar_compute_node.storages"]
dummy = "bazaar_compute_node.contrib.dummy.plugin:create_storage"

[project.entry-points."bazaar_compute_node.audits"]
dummy = "bazaar_compute_node.contrib.dummy.plugin:create_audit"

[project.entry-points."bazaar_compute_node.controls"]
dummy = "bazaar_compute_node.contrib.dummy.plugin:create_control"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
