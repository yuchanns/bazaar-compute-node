[project]
name = "bcn-workspace"
version = "0.0.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.20.0",
    "bcn-test-support",
    "blockbuster>=1.5.29,<1.6",
    "packaging>=25.0",
    "pydantic>=2.12.0",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "types-aiofiles>=25.1.0",
    "uv_build>=0.13.0,<0.14.0",
]

[tool.uv]
package = false

[tool.uv.sources]
bazaar-compute-node = { workspace = true }
bazaar-core = { workspace = true }
bazaar-contrib-status = { workspace = true }
bazaar-contrib-config = { workspace = true }
bazaar-contrib-config-filesystem = { workspace = true }
bazaar-contrib-config-versions = { workspace = true }
bazaar-contrib-logging = { workspace = true }
bazaar-contrib-manager = { workspace = true }
bazaar-contrib-invoke = { workspace = true }
bazaar-contrib-node-management = { workspace = true }
bazaar-contrib-sidecar = { workspace = true }
bazaar-contrib-sidecar-unix = { workspace = true }
bazaar-contrib-sidecar-windows = { workspace = true }
bcn-test-support = { path = "tests/support", editable = true }

[tool.uv.workspace]
members = ["app", "core", "contrib/*"]

[tool.ruff.lint]
extend-select = ["ASYNC"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
# New workspace members own their tests; the retained legacy suite stays under tests/.
# Asynchronous member tests use pytest-asyncio in their package configuration.
addopts = "-m 'not e2e and not system' -p no:anyio"
markers = [
    "e2e: requires a real external provider",
    "system: runs real native system services in an isolated environment",
]
