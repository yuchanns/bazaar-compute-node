[project]
name = "bazaar-compute-node"
version = "0.3.0"
description = "The Bazaar Compute Node Application"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-core==0.3.0",
    "bazaar-contrib-status==0.3.0",
    "bazaar-contrib-config==0.3.0",
    "bazaar-contrib-config-filesystem==0.3.0",
    "bazaar-contrib-config-versions==0.3.0",
    "bazaar-contrib-logging==0.3.0",
    "bazaar-contrib-manager==0.3.0",
    "bazaar-contrib-invoke==0.3.0",
    "click>=8.1.0",
]

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[project.entry-points."bazaar_compute_node.contribs"]
node-run = "bazaar_compute_node.cli:run_commands"

[project.entry-points."bazaar_compute_node.commands"]
run = "bazaar_compute_node.cli:run_entry"

[project.scripts]
bcn = "bazaar_compute_node.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "build_backend"
backend-path = ["."]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "build_backend.py" },
    { file = "catalog.uv.lock" },
    { dir = "src" },
]

[tool.uv.build-backend]
source-include = ["build_backend.py", "catalog.uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extends = "../pyrightconfig.json"
include = ["src", "tests", "build_backend.py"]
extraPaths = ["tests/fixtures/contribs/src"]

[tool.ruff]
extend = "../pyproject.toml"
