[project]
name = "bazaar-compute-node"
version = "0.3.0rc11"
description = "The Bazaar Compute Node Application"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-core~=0.3.0rc1",
    "bazaar-contrib-config~=0.3.0rc1",
    "bazaar-contrib-config-versions~=0.3.0rc1",
    "bazaar-contrib-manager~=0.3.0rc1",
    "bazaar-contrib-invoke~=0.3.0rc1",
    "click>=8.1.0",
]

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[project.scripts]
bcn = "bazaar_compute_node.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extends = "../pyrightconfig.json"
include = ["src", "tests"]
extraPaths = ["tests/fixtures/contribs/src"]

[tool.ruff]
extend = "../pyproject.toml"
