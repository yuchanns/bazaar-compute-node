<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8">
<title>Bazaar · 多种登录方式</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,0..100;1,9..144,400..700,0..100&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="scene.css">
<script src="logos.js"></script>
<script src="ui.js"></script>
<script src="tents.js"></script>
<style>
  .login { display: grid; grid-template-columns: 1fr 600px; height: 100vh; }
  .art { position: relative; overflow: hidden; background: #0d1226; }
  .art svg.stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  .art svg.string { position: absolute; left: 0; top: 0; width: 100%; height: 300px; }
  .copy { position: absolute; left: 72px; top: 300px; right: 72px; }
  .copy .eyebrow { font: 700 12px var(--font-ui); letter-spacing: .32em; color: var(--saffron); }
  .copy h1 { margin: 18px 0 0; font-family: "Noto Serif SC", serif; font-weight: 900; font-size: 52px; line-height: 1.22; color: #f3ead8; letter-spacing: .02em; }
  .copy h1 span { color: var(--saffron); }
  .copy p { margin: 20px 0 0; font: italic 400 19px/1.5 var(--font-display); color: #a9a3b8; font-variation-settings: "opsz" 24, "SOFT" 80; max-width: 520px; }
  .street { position: absolute; left: -10px; right: -10px; bottom: 0; height: 220px; display: flex; align-items: flex-end; gap: 14px; padding: 0 24px; }
  .booth { flex: 1; position: relative; height: var(--h); background: #161829; border-radius: 6px 6px 0 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
  .booth .aw { position: absolute; left: -8px; right: -8px; top: -22px; height: 26px; border-radius: 4px 4px 0 0; background: repeating-linear-gradient(90deg, var(--a) 0 16px, var(--b) 16px 32px); }
  .booth .aw::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 8px; background: radial-gradient(circle at 8px 0, var(--a) 7.5px, transparent 8px) 0 0 / 32px 8px repeat-x, radial-gradient(circle at 24px 0, var(--b) 7.5px, transparent 8px) 0 0 / 32px 8px repeat-x; }
  .booth .glow { position: absolute; left: 14%; right: 14%; top: 26px; height: 46%; border-radius: 6px; background: #2a2433; }
  .booth .who { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); display: flex; gap: 8px; }
  .booth .who span { width: 10px; height: 14px; border-radius: 5px; background: #f5b342; }
  .booth .who span.j { background: #34c3a0; }
  .panel { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; padding: 40px 72px 28px; }
  .panel .brand { padding: 0; }
  .panel h2 { margin: 54px 0 6px; font-family: var(--font-display); font-size: 32px; font-weight: 650; letter-spacing: -.01em; }
  .panel .sub { color: var(--muted); font-size: 14px; }
  .sso { margin-top: 28px; height: 50px; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 18px; font-weight: 650; font-size: 15px; background: var(--lark); color: #fff; box-shadow: 0 10px 24px -12px rgba(51,112,255,.8); position: relative; }
  .sso .lg { width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  .sso .pref { margin-left: auto; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.18); }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12.5px; margin: 26px 0 18px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .fields { display: grid; gap: 14px; }
  .fields .input { height: 46px; }
  .go { margin-top: 18px; height: 48px; justify-content: center; font-size: 15px; border-radius: 12px; }
  .others { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .other { height: 44px; border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface-2); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-weight: 600; font-size: 13.5px; }
  .other .lg { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px; }
  .foot .seg span { padding: 4px 9px; }

  /* two faces of one card, each switching to the other from its top-right
     corner: the third-party logins, and the account and password. ?view=password */
  :root:not([data-view="password"]) .for-password { display: none !important; }
  :root[data-view="password"] .for-provider { display: none !important; }
  .method { position: relative; overflow: hidden; margin-top: 30px; min-height: 318px; padding: 34px 32px 30px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
  .corner { position: absolute; top: 0; right: 0; width: 62px; height: 62px; padding: 0; border: 0; background: none; color: var(--muted); clip-path: polygon(0 0, 100% 0, 100% 100%); cursor: pointer; }
  .corner .under { position: absolute; inset: 0; width: 100%; height: 100%; }
  .corner .layer { fill: var(--sunken); }
  .corner .shade { fill: rgba(0, 0, 0, .38); }
  :root[data-theme="day"] .corner .layer { fill: #ece3d3; }
  :root[data-theme="day"] .corner .shade { fill: rgba(92, 64, 22, .16); }
    .corner svg.lucide { position: absolute; top: 9px; right: 9px; width: 20px; height: 20px; stroke-width: 1.75; }
  .tip { position: absolute; top: 15px; right: 72px; font-size: 12px; color: var(--muted); padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); }
  .tip::after { content: ""; position: absolute; top: 50%; right: -4px; width: 6px; height: 6px; background: var(--surface); border-top: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); transform: translateY(-50%) rotate(45deg); }
  .third { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .third b { margin-top: 18px; font-size: 16px; font-weight: 650; }
  .third p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  .logo { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 18px; }
  .logo .tile { width: 68px; height: 68px; border-radius: 18px; display: grid; place-items: center; color: #fff; }
  .logo .tile svg { width: 44px; height: 44px; }
  .logo:not(.big) { border-radius: 11px; }
  .logo .tile.sm { width: 40px; height: 40px; border-radius: 11px; }
  .logo .tile.sm svg { width: 24px; height: 24px; }
  .logo .tile.sm svg.i { width: 22px; height: 22px; }
  .or { align-self: stretch; display: flex; align-items: center; gap: 12px; margin: 26px 0 18px; color: var(--faint); font-size: 12px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .logos { display: flex; justify-content: center; gap: 22px; }
  .stack { display: grid; gap: 16px; }
  .fld { display: grid; gap: 8px; }
  .fld label { font-size: 13px; font-weight: 500; color: var(--text-2); }
  .fld input { height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--sunken); font: 15px var(--font-ui); color: var(--text); outline: 0; }
  .fld input.is-focus { border-color: var(--saffron-line); box-shadow: 0 0 0 3px var(--saffron-soft); }
  input[type="password"] { letter-spacing: .14em; }
  .go { width: 100%; height: 46px; margin-top: 6px; border: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font: 600 15px var(--font-ui);
        background: var(--saffron); color: var(--saffron-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.14); }
  /* the morning market: the same street by day, flat like the night */
  :root[data-theme="day"] .art { background: #f3e3c3; }
  :root[data-theme="day"] .art svg.stars { display: none; }
  :root[data-theme="day"] .art svg.string path[stroke="#3a3550"], :root[data-theme="day"] .art svg.string line[stroke="#3a3550"] { stroke: #b6a383; }
  :root[data-theme="day"] .art svg.string rect[fill="#6b6380"] { fill: #9f8d6f; }
  :root[data-theme="day"] .copy .eyebrow { color: #b87708; }
  :root[data-theme="day"] .copy h1 { color: #2a2218; }
  :root[data-theme="day"] .copy h1 span { color: #c97f0f; }
  :root[data-theme="day"] .copy p { color: #6f6656; }
  :root[data-theme="day"] .booth { --b: #fff4dd !important; background: #e6d3b0; box-shadow: none; }
  :root[data-theme="day"] .booth .glow { background: #d6bf98; }
  .art svg.street-art { position: absolute; inset: 0; width: 100%; height: 100%; }
  .art .copy { z-index: 1; }
  body { background: var(--bg); }
</style>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('view')) document.documentElement.dataset.view = q.get('view');
  if (q.get('state')) document.documentElement.dataset.state = q.get('state');
</script>
</head>
