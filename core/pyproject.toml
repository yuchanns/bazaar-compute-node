[project]
name = "bazaar-core"
version = "0.3.0"
description = "The Bazaar Compute Node Core"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "packaging>=25.0",
    "pydantic>=2.12.0",
]

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extends = "../pyrightconfig.json"
include = ["src", "tests"]

[tool.ruff]
extend = "../pyproject.toml"
